name: Desktop app

# Builds the Windows installer and portable .exe. Download them from the run's artifacts; a
# v* tag also attaches them to a GitHub release.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (e.g. v0.1.0) on the commit being built; empty builds artifacts only'
        required: false
        default: ''

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$env:WASM_BINDGEN_VERSION" --locked
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run dist -- --win --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: PhotoDesign-Windows
          path: desktop/release/*.exe
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PhotoDesign ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Windows installer (`PhotoDesign-Setup-*.exe`) and portable app (`PhotoDesign-Portable-*.exe`).
            To connect an AI agent (Claude Code, Codex, Antigravity), see "Connect an AI agent (MCP)" in the README.
          files: desktop/release/*.exe
