[package]
name = "photodesign-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PhotoDesign's engine bridge: the Rust engine, compiled to WebAssembly for the TypeScript UI"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-engine = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-io = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
